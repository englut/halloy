[package]
name = "halloy"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Halloy IRC Client"
documentation = "https://halloy.chat/"
license.workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Casper Rogild Storm", "Cory Forsstrom", "Andrew Baldwin"]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.97"
bytes = "1.10.1"
chrono = { version = "0.4.40", features = ["serde", "unstable-locales"] }
const_format = "0.2.36"
emojis = "0.9.0"
futures = "0.3.32"
hashbrown = { version = "0.17", features = ["serde"] }
iced = { version = "0.15.0-dev", default-features = false }
itertools = "0.15.0"
log = { version = "0.4.30", features = ["std"] }
nom = "8.0"
nucleo-matcher = "0.3.1"
palette = "0.7.4"
percent-encoding = "2.3.2"
rand = "0.10.1"
rand_chacha = "0.10.0"
reqwest = {
  version = "0.13",
  default-features = false,
  features = [
    "charset",
    "http2",
    "json",
    "rustls-no-provider",
    "socks",
    "stream",
    "system-proxy",
  ]
}
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
timeago = "0.6.0"
tokio = { version = "1.52.3" }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7", features = ["io"] }
unicode-segmentation = "1.13.2"
uptime_lib = "0.3.1"
url = { version = "2.5.0", features = ["serde"] }

base64 = "0.23.1"
derive_more = "2.1.1"
iced_core = "0.15.0-dev"
seahash = "4.1.0"
serde = "1.0.229"
toml = "1.1.6+spec-1.1.0"

[workspace.lints.clippy]
cast_lossless = "deny"
cloned_instead_of_copied = "deny"
default_trait_access = "deny"
ignored_unit_patterns = "deny"
items_after_statements = "deny"
manual_is_variant_and = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
unnecessary_wraps = "deny"

[workspace.metadata.typos.default]
extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",  # Ignore lines with trailing spellchecker:disable-line
  "nmap -Pn",
]
extend-ignore-identifiers-re = [
  "ERR_[A-Z]+",  # IRC Error Numeric
  "RPL_[A-Z]+",  # IRC Reply Numeric
  "TehPeGaSuS",
  "0ther0ne",
]

[workspace.metadata.typos.files]
extend-exclude = ["data/tests/message/*.json"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
const_format = { workspace = true }
dirs-next = "2.0.0"
emojis = { workspace = true }
futures = { workspace = true }
hashbrown = { workspace = true }
iced = {
  workspace = true,
  features = [
    "advanced",
    "crisp",
    "fira-sans",
    "highlighter",
    "image",
    "svg",
    "tiny-skia",
    "tokio",
    "wayland",
    "web-colors",
    "wgpu",
    "x11",
  ]
}
image = "0.25"
itertools = { workspace = true }
log = { workspace = true }
nucleo-matcher = { workspace = true }
palette = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
reqwest = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
timeago = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "rt"] }
tokio-stream = { workspace = true, features = ["fs"] }
uptime_lib = { workspace = true }
url = { workspace = true }

data = { path = "crates/data", version = "0.1.0" }
ipc = { path = "crates/ipc", version = "0.1.0" }
irc = { path = "crates/irc", version = "0.1.0" }

bytesize = "2.0.1"
fern = "0.7.1"
humantime = "2.2.0"
mundy = {
  version = "0.1.9",
  default-features = false,
  features = [
    "color-scheme",
    "log",
    "tokio",
  ]
}
notify-rust = { version = "4.18", features = ["images"] }
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
rfd = {
  version = "0.15.2",
  default-features = false,
  features = [
    "tokio",
    "xdg-portal",
  ]
}
rodio = "0.22.0"
signal-hook = "0.3.18"
strsim = "0.11.1"
unicode-segmentation = "1.6"
uuid = { version = "1.23", features = ["v7"] }

[dev-dependencies]
iced = {
  workspace = true,
  features = [
    "advanced",
    "crisp",
    "debug",
    "fira-sans",
    "image",
    "svg",
    "tiny-skia",
    "tokio",
    "wayland",
    "web-colors",
    "wgpu",
    "x11",
  ]
}

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
    "std",
  ]
}
objc2-foundation = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSString",
    "NSURL",
    "std",
  ]
}

[target."cfg(windows)".dependencies]
iced = {
  workspace = true,
  features = [
    "sysinfo",
    "web-colors",
  ]
}

[target."cfg(windows)".dev-dependencies]
iced = {
  workspace = true,
  features = [
    "debug",
    "sysinfo",
    "web-colors",
  ]
}

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.2"
windows_exe_info = "0.4"

[features]
default = ["iosevka-font"]
iosevka-font = []
tor = ["data/tor"]

[lints]
workspace = true

[patch.crates-io]
iced = { git = "https://github.com/squidowl/iced", rev = "138b1d0ddc86e108f7d4f25765afca126a8dc166" }
iced_core = { git = "https://github.com/squidowl/iced", rev = "138b1d0ddc86e108f7d4f25765afca126a8dc166" }
iced_wgpu = { git = "https://github.com/squidowl/iced", rev = "138b1d0ddc86e108f7d4f25765afca126a8dc166" }

[patch."https://github.com/hecrj/cosmic-text.git"]
cosmic-text = { git = "https://github.com/squidowl/cosmic-text", rev = "f959ab5f753a911ce3c3649c22494b07da5d5340" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.ci]
inherits = "dev"
opt-level = 0
debug = false

# Don't optimize dependencies in CI.
[profile.ci.package."*"]
opt-level = 0

[profile.packaging]
inherits = "release"
lto = "fat"
codegen-units = 1
